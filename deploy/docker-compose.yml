services:
  mysql:
    image: mysql:8.0
    container_name: tancheng-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-zjg060703}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ../server/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: tancheng-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: ../server
    container_name: tancheng-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_URL: jdbc:mysql://mysql:3306/tancheng?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zjg060703}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      UPLOAD_DIR: /data/upload
      ORDER_TIMEOUT_MS: 900000
    ports:
      - "8081:8081"
    volumes:
      - upload-data:/data/upload

  nginx:
    image: nginx:1.27-alpine
    container_name: tancheng-nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物（web 工程 npm run build 的输出）
      - ../nginx-1.18.0/html/tancheng:/usr/share/nginx/html:ro
      - upload-data:/usr/share/nginx/html/imgs:ro

volumes:
  mysql-data:
  redis-data:
  upload-data: