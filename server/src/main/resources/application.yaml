server:
  port: ${SERVER_PORT:8081}
  tomcat:
    threads:
      max: 400
      min-spare: 50
    # 压测发现 500 并发时接收队列被打满，出现连接失败，这里上调队列与连接上限
    accept-count: 1000
    max-connections: 10000

spring:
  application:
    name: tancheng
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/tancheng?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.tancheng.entity

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  # 未支付订单超时时间（毫秒），默认 15 分钟
  order-timeout-ms: ${ORDER_TIMEOUT_MS:900000}
  # 超时订单扫描间隔（毫秒）
  order-timeout-scan-ms: ${ORDER_TIMEOUT_SCAN_MS:10000}

logging:
  level:
    com.tancheng: debug
